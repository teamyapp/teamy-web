kind: pipeline
type: docker
name: feature

steps:
  - name: retrieve cache
    image: ghcr.io/teamyapp/drone-cache:0.1.9
    volumes:
      - name: cache
        path: /var/lib/cache
    settings:
      mode: retrieve
      version_file_path: yarn.lock
      cacheable_relative_paths:
        - node_modules
      storage_type: volume
      volume_cache_root_dir: /var/lib/cache
  - name: build frontend
    image: node:21.6.0-alpine3.19
    environment:
      GITHUB_PACKAGES_ACCESS_TOKEN:
        from_secret: GITHUB_PACKAGES_ACCESS_TOKEN
    commands:
      - apk add --no-cache git g++ make python3
      - sh ./scripts/prepare.sh "$GITHUB_PACKAGES_ACCESS_TOKEN"
      - yarn install --frozen-lockfile
      - yarn build:staging
  - name: run unit tests
    image: node:21.6.0-alpine3.19
    commands:
      - apk add --no-cache git
      - CI=true yarn test
  - name: persist cache
    image: ghcr.io/teamyapp/drone-cache:0.1.9
    volumes:
      - name: cache
        path: /var/lib/cache
    settings:
      mode: persist
      version_file_path: yarn.lock
      cacheable_relative_paths:
        - node_modules
      storage_type: volume
      volume_cache_root_dir: /var/lib/cache
  - name: slack
    image: plugins/slack
    settings:
      webhook:
        from_secret: SLACK_WEBHOOK
      channel: code
    when:
      status: [ success, failure ]
volumes:
  - name: cache
    host:
      path: /var/drone/cache
trigger:
  branch:
    - master
    - main
  event:
    - pull_request
---
kind: pipeline
type: docker
name: testing

steps:
  - name: retrieve cache
    image: ghcr.io/teamyapp/drone-cache:0.1.9
    volumes:
      - name: cache
        path: /var/lib/cache
    settings:
      mode: retrieve
      version_file_path: yarn.lock
      cacheable_relative_paths:
        - node_modules
      storage_type: volume
      volume_cache_root_dir: /var/lib/cache
  - name: build frontend
    image: node:21.6.0-alpine3.19
    environment:
      GITHUB_PACKAGES_ACCESS_TOKEN:
        from_secret: GITHUB_PACKAGES_ACCESS_TOKEN
    commands:
      - apk add --no-cache git g++ make python3
      - sh ./scripts/prepare.sh "$GITHUB_PACKAGES_ACCESS_TOKEN"
      - yarn install --frozen-lockfile
      - yarn build:testing
  - name: build & publish Docker image
    image: plugins/docker
    settings:
      username:
        from_secret: DOCKER_USERNAME
      password:
        from_secret: DOCKER_PASSWORD
      repo: registry.digitalocean.com/teamyapp/teamy-web-testing
      registry: registry.digitalocean.com
  - name: notify image update
    image: plugins/webhook
    settings:
      username:
        from_secret: KEEL_USERNAME
      password:
        from_secret: KEEL_PASSWORD
      urls: https://deploy.internal.teamyapp.com/v1/webhooks/native
      template: |
        {
          "name": "registry.digitalocean.com/teamyapp/teamy-web-testing",
          "tag": "latest"
        }
  - name: persist cache
    image: ghcr.io/teamyapp/drone-cache:0.1.9
    volumes:
      - name: cache
        path: /var/lib/cache
    settings:
      mode: persist
      version_file_path: yarn.lock
      cacheable_relative_paths:
        - node_modules
      storage_type: volume
      volume_cache_root_dir: /var/lib/cache
  - name: slack
    image: plugins/slack
    settings:
      webhook:
        from_secret: SLACK_WEBHOOK
      channel: code
    when:
      status: [ success, failure ]
volumes:
  - name: cache
    host:
      path: /var/drone/cache
trigger:
  branch:
    - testing
  event:
    - push
