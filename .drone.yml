kind: pipeline
type: kubernetes
name: feature

steps:
  - name: Run unit tests
    image: node:16.13.0-alpine3.13
    commands:
      - apk add --no-cache g++ make python3
      - yarn install --frozen-lockfile
      - CI=true yarn test
trigger:
  branch:
    - master
    - main
  event:
    - pull_request
---
kind: pipeline
type: kubernetes
name: staging

steps:
  - name: Build Docker image
    image: plugins/docker
    settings:
      username:
        from_secret: DOCKER_USERNAME
      password:
        from_secret: DOCKER_PASSWORD
      repo: registry.digitalocean.com/teamyapp/teamy-web-staging
      registry: registry.digitalocean.com
      target: production
      build_args:
        - ENVIRONMENT=staging
trigger:
  branch:
    - master
    - main
  event:
    - push
---
kind: pipeline
type: kubernetes
name: testing

steps:
  - name: build image
    image: plugins/docker
    settings:
      username:
        from_secret: DOCKER_USERNAME
      password:
        from_secret: DOCKER_PASSWORD
      repo: registry.digitalocean.com/teamyapp/teamy-web-testing
      registry: registry.digitalocean.com
      target: production
      build_args:
        - ENVIRONMENT=testing
trigger:
  branch:
    - testing
  event:
    - push
---
kind: pipeline
type: kubernetes
name: production

steps:
  - name: build image
    image: plugins/docker
    settings:
      username:
        from_secret: DOCKER_USERNAME
      password:
        from_secret: DOCKER_PASSWORD
      repo: registry.digitalocean.com/teamyapp/teamy-web
      registry: registry.digitalocean.com
      target: production
      build_args:
        - ENVIRONMENT=production
trigger:
  branch:
    - production
  event:
    - push