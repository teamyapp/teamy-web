#import "./user.graphql"
#import "./phase.graphql"
#import "./storyPreview.graphql"
#import "./team.graphql"

fragment ProjectFragment on Project {
    id
    name
    expectedStartAt
    actualStartAt
    expectedEndAt
    actualEndAt
    creator {
        ...UserFragment
    }
    createdAt
    updatedAt
    phases {
        ...PhaseFragment
    }
    stories {
        ...StoryPreviewFragment
    }
    team {
        ...TeamFragment
    }
}