kind: pipeline
type: kubernetes
name: feature

steps:
  - name: Run unit tests
    image: node:16.13.0-alpine3.13
    commands:
      - apk add --no-cache git g++ make python3
      - yarn install --frozen-lockfile
      - CI=true yarn test
trigger:
  branch:
    - master
    - main
  event:
    - pull_request
---
kind: pipeline
type: kubernetes
name: testing

steps:
  - name: build & publish Docker image
    image: plugins/docker
    settings:
      username:
        from_secret: DOCKER_USERNAME
      password:
        from_secret: DOCKER_PASSWORD
      repo: registry.digitalocean.com/teamyapp/teamy-web-testing
      registry: registry.digitalocean.com
      target: production
      build_args:
        - ENVIRONMENT=testing
  - name: notify image update
    image: plugins/webhook
    settings:
      urls: http://keel.keel.svc.cluster.local:9300/v1/webhooks/native
      template: |
        {
          "name": "registry.digitalocean.com/teamyapp/teamy-web-testing",
          "tag": "latest"
        }
trigger:
  branch:
    - testing
  event:
    - push
---
kind: pipeline
type: kubernetes
name: staging

steps:
  - name: build & publish Docker image
    image: plugins/docker
    settings:
      username:
        from_secret: DOCKER_USERNAME
      password:
        from_secret: DOCKER_PASSWORD
      repo: registry.digitalocean.com/teamyapp/teamy-web-staging
      registry: registry.digitalocean.com
      target: production
      build_args:
        - ENVIRONMENT=staging
  - name: notify image update
    image: plugins/webhook
    settings:
      urls: http://keel.keel.svc.cluster.local:9300/v1/webhooks/native
      content_type: application/json
      template: |
        {
          "name": "registry.digitalocean.com/teamyapp/teamy-web-staging",
          "tag": "latest"
        }
trigger:
  branch:
    - master
    - main
  event:
    - push
---
kind: pipeline
type: kubernetes
name: production

steps:
  - name: build & publish Docker image
    image: plugins/docker
    settings:
      username:
        from_secret: DOCKER_USERNAME
      password:
        from_secret: DOCKER_PASSWORD
      repo: registry.digitalocean.com/teamyapp/teamy-web
      registry: registry.digitalocean.com
      target: production
      build_args:
        - ENVIRONMENT=production
  - name: notify image update
    image: plugins/webhook
    settings:
      urls: http://keel.keel.svc.cluster.local:9300/v1/webhooks/native
      template: |
        {
          "name": "registry.digitalocean.com/teamyapp/teamy-web",
          "tag": "latest"
        }
trigger:
  branch:
    - production
  event:
    - push