kind: pipeline
type: kubernetes
name: feature

steps:
  - name: restore cache
    image: ghcr.io/teamyapp/drone-cache:0.0.9
    settings:
      s3_endpoint: sfo3.digitaloceanspaces.com
      s3_access_key_id:
        from_secret: SPACE_ACCESS_KEY
      s3_secret:
        from_secret: SPACE_SECRET
      s3_bucket: teamyapp
      remote_root_dir: cache/node/teamy-web
      restore: true
      cacheable_relative_paths:
        - node_modules
  - name: build frontend
    image: node:16.13.0-alpine3.13
    commands:
      - apk add --no-cache git g++ make python3
      - yarn install --frozen-lockfile
      - yarn build:staging
  - name: run unit tests
    image: node:16.13.0-alpine3.13
    commands:
      - apk add --no-cache git
      - CI=true yarn test
  - name: refresh cache
    image: ghcr.io/teamyapp/drone-cache:0.0.9
    settings:
      s3_endpoint: sfo3.digitaloceanspaces.com
      s3_access_key_id:
        from_secret: SPACE_ACCESS_KEY
      s3_secret:
        from_secret: SPACE_SECRET
      s3_bucket: teamyapp
      remote_root_dir: cache/node/teamy-web
      refresh: true
      cacheable_relative_paths:
        - node_modules
  - name: slack
    image: plugins/slack
    settings:
      webhook:
        from_secret: SLACK_WEBHOOK
      channel: code
    when:
      status: [ success, failure ]
trigger:
  branch:
    - master
    - main
  event:
    - pull_request
---
kind: pipeline
type: kubernetes
name: testing

steps:
  - name: restore cache
    image: ghcr.io/teamyapp/drone-cache:0.0.9
    settings:
      s3_endpoint: sfo3.digitaloceanspaces.com
      s3_access_key_id:
        from_secret: SPACE_ACCESS_KEY
      s3_secret:
        from_secret: SPACE_SECRET
      s3_bucket: teamyapp
      remote_root_dir: cache/node/teamy-web
      restore: true
      cacheable_relative_paths:
        - node_modules
  - name: build frontend
    image: node:16.13.0-alpine3.13
    commands:
      - apk add --no-cache git g++ make python3
      - yarn install --frozen-lockfile
      - yarn build:testing
  - name: build & publish Docker image
    image: plugins/docker
    settings:
      username:
        from_secret: DOCKER_USERNAME
      password:
        from_secret: DOCKER_PASSWORD
      repo: registry.digitalocean.com/teamyapp/teamy-web-testing
      registry: registry.digitalocean.com
  - name: notify image update
    image: plugins/webhook
    settings:
      urls: http://keel.keel.svc.cluster.local:9300/v1/webhooks/native
      template: |
        {
          "name": "registry.digitalocean.com/teamyapp/teamy-web-testing",
          "tag": "latest"
        }
  - name: refresh cache
    image: ghcr.io/teamyapp/drone-cache:0.0.9
    settings:
      s3_endpoint: sfo3.digitaloceanspaces.com
      s3_access_key_id:
        from_secret: SPACE_ACCESS_KEY
      s3_secret:
        from_secret: SPACE_SECRET
      s3_bucket: teamyapp
      remote_root_dir: cache/node/teamy-web
      refresh: true
      cacheable_relative_paths:
        - node_modules
  - name: slack
    image: plugins/slack
    settings:
      webhook:
        from_secret: SLACK_WEBHOOK
      channel: code
    when:
      status: [ success, failure ]
trigger:
  branch:
    - testing
  event:
    - push
