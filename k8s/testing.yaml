apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: testing
  name: teamy-web
  labels:
    app: teamy-web
  annotations:
    # force policy will ensure that deployment is updated
    # even when tag is unchanged (latest remains)
    keel.sh/policy: force
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: teamy-web
  template:
    metadata:
      labels:
        app: teamy-web
    spec:
      containers:
        - name: teamy-web
          image: registry.digitalocean.com/teamyapp/teamy-web-testing:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            - name: NPM_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: teamy
                  key: npm-auth-token
          volumeMounts:
            - name: project-root
              mountPath: /usr/share/nginx/html
          lifecycle:
            postStart:
              exec:
                 command: ["/bin/sh", "-c", "echo '//registry.npmjs.org/:_authToken=${NPM_AUTH_TOKEN}' > /usr/share/nginx/html/.npmrc && echo '@teamyapp:registry=https://npm.pkg.github.com/' >> /usr/share/nginx/html/.npmrc"]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  namespace: testing
  name: teamy-web
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind:       Deployment
    name:       teamy-web
  updatePolicy:
    updateMode: "Auto"
---
apiVersion: v1
kind: Service
metadata:
  namespace: testing
  name: teamy-web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/instance: web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: teamy
spec:
  selector:
    app: teamy-web
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  namespace: testing
  name: teamy-web
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`testing.teamyapp.com`)
      services:
        - kind: Service
          name: teamy-web
          namespace: testing
          port: 80
          passHostHeader: true
  tls:
    secretName: cert-teamyapp.com

