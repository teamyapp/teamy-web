#import "./team.graphql"
#import "./user.graphql"
#import "./invitation.graphql"

fragment TeamMemberGroupFragment on TeamMemberGroup {
    id
    name
    team {
        ...TeamFragment
    }
    members {
        ...UserFragment
    }
    orderIndex
    invitations {
        ...InvitationFragment
    }
    createdAt
    updatedAt
}
