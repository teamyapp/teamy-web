apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: production
  name: teamy-web
  labels:
    app: teamy-web
  annotations:
    # force policy will ensure that deployment is updated
    # even when tag is unchanged (latest remains)
    keel.sh/policy: force
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: teamy-web
  template:
    metadata:
      labels:
        app: teamy-web
    spec:
      containers:
        - name: teamy-web
          image: harbor.internal.teamyapp.com/internal/teamy-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
      imagePullSecrets:
        - name: harbor-cred
---
apiVersion: v1
kind: Service
metadata:
  namespace: production
  name: teamy-web
spec:
  selector:
    app: teamy-web
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  namespace: production
  name: teamy-web
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`teamyapp.com`)
      services:
        - kind: Service
          name: teamy-web
          namespace: production
          port: 80
          passHostHeader: true
  tls:
    secretName: teamy-cert

